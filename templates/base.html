<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}FinSight{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="/" class="brand">FinSight</a>
        <div>
            <a href="/">Home</a> |
            <a href="/screener">Screener</a> |
            {% if session.get('user_id') %}
                <a href="/user/{{ session['user_id'] }}/watchlist">My Watchlist</a> |
                <a href="/logout">Log Out</a>
            {% else %}
                <a href="/login">Login</a> |
                <a href="/register">Register</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
