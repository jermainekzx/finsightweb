={% extends 'base.html' %}

{% block title %}Home | FinSight{% endblock %}

{% block content %}
    <h1>Welcome to FinSight</h1>
    <p class="tagline">Equity Research, Simplified — SGX and US stocks in one place</p>

    <div class="card">
        <h2>Search for a Stock</h2>
        <form action="/search" method="POST">
            <div class="form-group">
                <label for="ticker">Enter a ticker symbol</label>
                <input type="text" name="ticker" id="ticker" placeholder="e.g. AAPL, D05.SI">
            </div>
            <button type="submit">Search</button>
        </form>
    </div>
{% endblock %}
